[project]
name = "clawcasts"
version = "0.1.0"
description = "Personal podcast queue and archive feeds published to S3/CloudFront"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "feedgen>=1.0",
    "boto3>=1.34",
]

[project.scripts]
clawcasts = "clawcasts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawcasts"]
